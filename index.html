  <video class="bg-video" id="bg-video" autoplay muted loop playsinline preload="metadata" poster="media/bg-poster.jpg" aria-hidden="true" tabindex="-1" disablepictureinpicture disableremoteplayback>
    <source src="media/bg.mp4" type="video/mp4">
  </video>
</div>
<script>
/* Runs before playback can start. Small screens get the lighter video and poster
   (the desktop file stays listed as a fallback source); reduced motion, or an earlier
   "pause" from the visitor, means no autoplay, so the poster is shown instead. */
(function () {
  var v = document.getElementById('bg-video'), d = document.documentElement;
  if (!v || !window.matchMedia) return;
  var mq = function (q) { return window.matchMedia(q).matches; };
  var stored = null;
  try { stored = window.localStorage.getItem('ontos-bg-paused'); } catch (e) {}
  var conn = navigator.connection || {};
  var small = mq('(max-width: 768px), (max-height: 540px) and (hover: none)') || conn.saveData === true;
  var still = mq('(prefers-reduced-motion: reduce)') || stored === '1';
  var desktop = v.querySelector('source');
  if (desktop) desktop.addEventListener('error', function () { d.className += ' no-video'; });
  v.addEventListener('error', function () { d.className += ' no-video'; });
  if (small) {
    var s = document.createElement('source');
    s.src = 'media/bg-mobile.mp4';
    s.type = 'video/mp4';
    v.insertBefore(s, desktop);
    v.setAttribute('poster', 'media/bg-poster-small.jpg');
  }
  if (still) {
    v.removeAttribute('autoplay');
    v.autoplay = false;
    v.preload = 'none';
    d.className += ' bg-still';
  }
  if (small || still) v.load();
})();
</script>
